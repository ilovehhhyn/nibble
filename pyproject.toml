[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nibble-rl"
version = "0.1.0"
description = "Experimental BYO GPU API for bounded, audited AReaL jobs"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30", "psutil>=5.9"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
nibble = "nibble.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
